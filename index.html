<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI 트립 플래너 - 맞춤형 여행 일정 생성기</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Pretendard & Inter 폰트 (모바일 가독성 최적화) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* 가로 스크롤바 숨김 처리 (모바일 칩 메뉴용) */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 카드 등장 애니메이션 */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-up {
      animation: fadeUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 부드러운 스크롤 */
    html {
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-x-hidden selection:bg-blue-100 selection:text-blue-700">

  <!-- 모바일 앱 컨테이너 (데스크톱에서도 모바일 앱 비율로 깔끔하게 중앙 정렬) -->
  <div class="min-h-screen max-w-lg mx-auto bg-slate-50 shadow-xl shadow-slate-200/60 flex flex-col relative pb-12">
    
    <!-- 상단 고정 헤더 -->
    <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-slate-100 px-5 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-sky-400 flex items-center justify-center text-white shadow-sm shadow-blue-500/30">
          <!-- 나침반/비행기 아이콘 -->
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-slate-900 leading-tight">트립메이트 AI</h1>
          <p class="text-[11px] text-slate-400 font-medium">나만의 맞춤 여행 코스 플래너</p>
        </div>
      </div>

      <!-- API 연결 상태 표시 배지 -->
      <span id="api-status-badge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200/70">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
        예시 모드
      </span>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="flex-1 px-4 pt-5 space-y-6">

      <!-- 1. 여행 조건 입력 폼 카드 -->
      <section id="planner-form-section" class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 space-y-6">
        
        <!-- (1) 여행지 입력 -->
        <div class="space-y-2.5">
          <label for="destination-input" class="flex items-center justify-between text-sm font-bold text-slate-800">
            <span>어디로 떠나시나요?</span>
            <span class="text-xs font-normal text-blue-600">필수 입력</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
            <input 
              type="text" 
              id="destination-input" 
              value="제주도"
              placeholder="예: 제주도, 도쿄, 강릉, 파리..." 
              class="w-full pl-11 pr-10 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold text-slate-900 placeholder:text-slate-400 placeholder:font-normal focus:outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all"
            />
            <!-- 입력 초기화 버튼 -->
            <button 
              type="button" 
              id="clear-destination-btn"
              aria-label="여행지 지우기"
              class="absolute inset-y-0 right-3 flex items-center text-slate-400 hover:text-slate-600 p-1"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <!-- 인기 여행지 빠른 선택 칩 -->
          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-0.5" id="quick-destinations">
            <button type="button" data-dest="제주도" class="dest-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-blue-50 text-blue-600 border border-blue-200 transition active:scale-95">🏝️ 제주도</button>
            <button type="button" data-dest="도쿄" class="dest-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200/70 transition active:scale-95">🗼 도쿄</button>
            <button type="button" data-dest="부산" class="dest-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200/70 transition active:scale-95">🌊 부산</button>
            <button type="button" data-dest="오사카" class="dest-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200/70 transition active:scale-95">🐙 오사카</button>
            <button type="button" data-dest="강릉" class="dest-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200/70 transition active:scale-95">☕ 강릉</button>
            <button type="button" data-dest="방콕" class="dest-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200/70 transition active:scale-95">🛺 방콕</button>
          </div>
        </div>

        <!-- (2) 여행 기간 선택 -->
        <div class="space-y-2.5">
          <label class="block text-sm font-bold text-slate-800">얼마나 머무르시나요?</label>
          <div class="grid grid-cols-5 gap-1.5" id="duration-group">
            <button type="button" data-days="1" data-label="당일치기" class="duration-btn py-2.5 px-1 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 border border-transparent transition active:scale-95">당일치기</button>
            <button type="button" data-days="2" data-label="1박 2일" class="duration-btn py-2.5 px-1 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 border border-transparent transition active:scale-95">1박 2일</button>
            <button type="button" data-days="3" data-label="2박 3일" class="duration-btn selected py-2.5 px-1 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm shadow-blue-500/25 transition active:scale-95">2박 3일</button>
            <button type="button" data-days="4" data-label="3박 4일" class="duration-btn py-2.5 px-1 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 border border-transparent transition active:scale-95">3박 4일</button>
            <button type="button" data-days="5" data-label="4박 5일" class="duration-btn py-2.5 px-1 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 border border-transparent transition active:scale-95">4박 5일</button>
          </div>
        </div>

        <!-- (3) 누구와 가는지 선택 -->
        <div class="space-y-2.5">
          <label class="block text-sm font-bold text-slate-800">누구와 함께 가나요?</label>
          <div class="grid grid-cols-3 gap-2" id="companion-group">
            <button type="button" data-value="혼자서" class="companion-btn flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl border border-slate-200 bg-white text-slate-600 text-xs font-semibold transition active:scale-95">
              <span class="text-lg">🎒</span>
              <span>혼자서</span>
            </button>
            <button type="button" data-value="연인과" class="companion-btn selected flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl border-2 border-blue-600 bg-blue-50/60 text-blue-700 text-xs font-bold transition active:scale-95">
              <span class="text-lg">💑</span>
              <span>연인과</span>
            </button>
            <button type="button" data-value="친구와" class="companion-btn flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl border border-slate-200 bg-white text-slate-600 text-xs font-semibold transition active:scale-95">
              <span class="text-lg">👯</span>
              <span>친구와</span>
            </button>
            <button type="button" data-value="아이와 가족" class="companion-btn flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl border border-slate-200 bg-white text-slate-600 text-xs font-semibold transition active:scale-95">
              <span class="text-lg">👨‍👩‍👧‍👦</span>
              <span>아이와 가족</span>
            </button>
            <button type="button" data-value="부모님과" class="companion-btn flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl border border-slate-200 bg-white text-slate-600 text-xs font-semibold transition active:scale-95">
              <span class="text-lg">🌿</span>
              <span>부모님과</span>
            </button>
            <button type="button" data-value="반려동물과" class="companion-btn flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl border border-slate-200 bg-white text-slate-600 text-xs font-semibold transition active:scale-95">
              <span class="text-lg">🐶</span>
              <span>반려동물과</span>
            </button>
          </div>
        </div>

        <!-- (4) 관심사 선택 (다중 선택 가능) -->
        <div class="space-y-2.5">
          <div class="flex items-center justify-between">
            <label class="text-sm font-bold text-slate-800">관심사 및 테마</label>
            <span class="text-[11px] text-slate-400 font-medium">여러 개 선택 가능</span>
          </div>
          <div class="flex flex-wrap gap-2" id="interests-group">
            <button type="button" data-value="맛집 탐방" class="interest-btn selected px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition active:scale-95">🍽️ 맛집 탐방</button>
            <button type="button" data-value="감성 카페" class="interest-btn selected px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition active:scale-95">☕ 감성 카페</button>
            <button type="button" data-value="자연/힐링" class="interest-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200/70 transition active:scale-95">🌲 자연/힐링</button>
            <button type="button" data-value="인생샷 명소" class="interest-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200/70 transition active:scale-95">📸 인생샷 명소</button>
            <button type="button" data-value="액티비티" class="interest-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200/70 transition active:scale-95">🏄 액티비티</button>
            <button type="button" data-value="쇼핑/소품샵" class="interest-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200/70 transition active:scale-95">🛍️ 쇼핑/소품샵</button>
            <button type="button" data-value="문화/전시" class="interest-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200/70 transition active:scale-95">🎨 문화/전시</button>
            <button type="button" data-value="야경/로컬펍" class="interest-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200/70 transition active:scale-95">🌙 야경/로컬펍</button>
          </div>
        </div>

        <!-- 인라인 유효성 안내 메시지 -->
        <p id="form-error-msg" class="hidden text-xs font-semibold text-rose-500 bg-rose-50 px-3.5 py-2.5 rounded-xl border border-rose-100">
          여행지를 입력해 주세요!
        </p>

        <!-- (5) 일정 생성 버튼 -->
        <button 
          type="button" 
          id="generate-btn"
          class="w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-base shadow-lg shadow-blue-600/25 flex items-center justify-center gap-2 transition-all active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
          </svg>
          <span>AI 맞춤 일정 만들기</span>
        </button>
      </section>

      <!-- 2. 로딩 상태 UI (스켈레톤 카드) -->
      <section id="loading-section" class="hidden space-y-4 py-2">
        <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm text-center space-y-3">
          <div class="w-12 h-12 mx-auto rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center">
            <svg class="w-6 h-6 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </div>
          <div>
            <h3 id="loading-title" class="text-sm font-bold text-slate-900">맞춤형 동선을 계산하고 있어요...</h3>
            <p class="text-xs text-slate-400 mt-1">잠시만 기다려 주시면 하루별 일정 카드가 완성됩니다</p>
          </div>
        </div>

        <!-- 스켈레톤 플레이스홀더 -->
        <div class="bg-white rounded-3xl p-5 border border-slate-100 space-y-4 animate-pulse">
          <div class="flex items-center gap-3">
            <div class="h-6 w-16 bg-slate-200 rounded-full"></div>
            <div class="h-5 w-40 bg-slate-200 rounded-lg"></div>
          </div>
          <div class="space-y-3 pt-2">
            <div class="h-16 bg-slate-100 rounded-2xl"></div>
            <div class="h-16 bg-slate-100 rounded-2xl"></div>
            <div class="h-16 bg-slate-100 rounded-2xl"></div>
          </div>
        </div>
      </section>

      <!-- 3. 결과 일정 섹션 -->
      <section id="result-section" class="hidden space-y-4">
        
        <!-- 여행 요약 헤더 카드 -->
        <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950 text-white rounded-3xl p-5 shadow-md space-y-3">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <span id="result-duration-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-blue-500/30 text-blue-200 border border-blue-400/30">2박 3일</span>
                <span id="result-companion-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-white/10 text-slate-200">💑 연인과</span>
              </div>
              <h2 id="result-title" class="text-xl font-bold mt-2 tracking-tight">제주도 맞춤 여행 일정</h2>
            </div>
            <!-- 복사 버튼 -->
            <button 
              type="button" 
              id="copy-itinerary-btn"
              title="전체 일정 복사"
              class="shrink-0 p-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white transition active:scale-95"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
              </svg>
            </button>
          </div>
          
          <p id="result-summary" class="text-xs text-slate-300 leading-relaxed">
            선택하신 관심사를 반영해 이동 동선이 꼬이지 않도록 구성한 추천 코스입니다.
          </p>

          <!-- 선택된 관심사 태그 목록 -->
          <div id="result-interests-list" class="flex flex-wrap gap-1.5 pt-1"></div>
        </div>

        <!-- 데이터 출처 안내 배너 (예시 데이터 사용 시에만 표시) -->
        <div id="fallback-notice" class="hidden bg-blue-50/90 border border-blue-100 rounded-2xl px-4 py-3 flex items-start gap-2.5">
          <span class="text-base leading-none mt-0.5">💡</span>
          <p class="text-xs text-blue-800 leading-relaxed">
            현재 <code class="font-mono font-semibold bg-blue-100 px-1 py-0.5 rounded">/api/plan</code> 서버가 연결되지 않아 <strong>추천 예시 일정</strong>을 보여드리고 있어요. Vercel 함수를 배포하면 Gemini가 생성한 실시간 일정이 자동으로 표시됩니다.
          </p>
        </div>

        <!-- Day별 필터 탭 (가로 스크롤 지원) -->
        <div id="day-filter-tabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 sticky top-[61px] z-20 bg-slate-50/95 backdrop-blur-sm">
          <!-- 동적으로 버튼 생성됨 -->
        </div>

        <!-- 하루별 일정 카드 컨테이너 -->
        <div id="days-container" class="space-y-4">
          <!-- 동적으로 Day 카드 생성됨 -->
        </div>

        <!-- 하단 액션 버튼 영역 -->
        <div class="pt-3 flex gap-2.5">
          <button 
            type="button" 
            id="scroll-top-btn"
            class="flex-1 py-3.5 px-4 rounded-2xl bg-white border border-slate-200 text-slate-700 font-bold text-xs shadow-sm hover:bg-slate-50 transition active:scale-95"
          >
            조건 다시 설정하기
          </button>
          <button 
            type="button" 
            id="copy-bottom-btn"
            class="flex-1 py-3.5 px-4 rounded-2xl bg-slate-900 text-white font-bold text-xs shadow-sm hover:bg-slate-800 transition active:scale-95"
          >
            일정 텍스트 복사하기
          </button>
        </div>

      </section>

    </main>
  </div>

  <!-- 토스트 알림 (alert 대체용) -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 translate-y-3">
    <div class="bg-slate-900/95 text-white text-xs font-semibold px-4 py-3 rounded-full shadow-lg flex items-center gap-2 whitespace-nowrap">
      <span class="text-emerald-400">✓</span>
      <span id="toast-message">클립보드에 복사되었습니다!</span>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * [Vercel /api/plan 연동 명세서]
     * 
     * 1. 요청 (Request):
     *    - URL: /api/plan
     *    - Method: POST
     *    - Headers: { "Content-Type": "application/json" }
     *    - Body:
     *      {
     *        "destination": "제주도",
     *        "duration": "2박 3일",
     *        "daysCount": 3,
     *        "companion": "연인과",
     *        "interests": ["맛집 탐방", "감성 카페"]
     *      }
     * 
     * 2. 응답 (Expected JSON Response from Gemini):
     *    {
     *      "destination": "제주도",
     *      "duration": "2박 3일",
     *      "companion": "연인과",
     *      "interests": ["맛집 탐방", "감성 카페"],
     *      "summary": "여행 전체를 아우르는 한 줄 요약 설명",
     *      "days": [
     *        {
     *          "day": 1,
     *          "title": "첫째 날 테마 제목",
     *          "items": [
     *            {
     *              "time": "10:30",
     *              "category": "관광", // "관광" | "맛집" | "카페" | "쇼핑" | "휴식"
     *              "place": "장소명",
     *              "description": "장소에 대한 간단한 설명",
     *              "tip": "방문 꿀팁 (선택 사항)"
     *            }
     *          ]
     *        }
     *      ]
     *    }
     * ============================================================================
     */

    // 애플리케이션 상태 관리
    const state = {
      destination: '제주도',
      daysCount: 3,
      durationLabel: '2박 3일',
      companion: '연인과',
      interests: ['맛집 탐방', '감성 카페'],
      selectedDayFilter: 'ALL', // 'ALL' 또는 1, 2, 3...
      currentPlan: null,
      isMockData: true
    };

    // DOM 요소 참조
    const els = {
      destInput: document.getElementById('destination-input'),
      clearDestBtn: document.getElementById('clear-destination-btn'),
      destChips: document.querySelectorAll('.dest-chip'),
      durationBtns: document.querySelectorAll('.duration-btn'),
      companionBtns: document.querySelectorAll('.companion-btn'),
      interestBtns: document.querySelectorAll('.interest-btn'),
      formErrorMsg: document.getElementById('form-error-msg'),
      generateBtn: document.getElementById('generate-btn'),
      loadingSection: document.getElementById('loading-section'),
      loadingTitle: document.getElementById('loading-title'),
      resultSection: document.getElementById('result-section'),
      resultTitle: document.getElementById('result-title'),
      resultDurationBadge: document.getElementById('result-duration-badge'),
      resultCompanionBadge: document.getElementById('result-companion-badge'),
      resultSummary: document.getElementById('result-summary'),
      resultInterestsList: document.getElementById('result-interests-list'),
      fallbackNotice: document.getElementById('fallback-notice'),
      apiStatusBadge: document.getElementById('api-status-badge'),
      dayFilterTabs: document.getElementById('day-filter-tabs'),
      daysContainer: document.getElementById('days-container'),
      copyItineraryBtn: document.getElementById('copy-itinerary-btn'),
      copyBottomBtn: document.getElementById('copy-bottom-btn'),
      scrollTopBtn: document.getElementById('scroll-top-btn'),
      toast: document.getElementById('toast'),
      toastMessage: document.getElementById('toast-message')
    };

    // 초기화 및 이벤트 바인딩
    function init() {
      // 1. 여행지 입력 및 인기 칩 이벤트
      els.destInput.addEventListener('input', (e) => {
        state.destination = e.target.value.trim();
        els.formErrorMsg.classList.add('hidden');
        updateDestChipHighlight();
      });

      els.clearDestBtn.addEventListener('click', () => {
        els.destInput.value = '';
        state.destination = '';
        els.destInput.focus();
        updateDestChipHighlight();
      });

      els.destChips.forEach(chip => {
        chip.addEventListener('click', () => {
          const dest = chip.dataset.dest;
          els.destInput.value = dest;
          state.destination = dest;
          els.formErrorMsg.classList.add('hidden');
          updateDestChipHighlight();
        });
      });

      // 2. 여행 기간 선택 이벤트
      els.durationBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          els.durationBtns.forEach(b => {
            b.className = 'duration-btn py-2.5 px-1 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 border border-transparent transition active:scale-95';
          });
          btn.className = 'duration-btn selected py-2.5 px-1 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm shadow-blue-500/25 transition active:scale-95';
          
          state.daysCount = parseInt(btn.dataset.days, 10);
          state.durationLabel = btn.dataset.label;
        });
      });

      // 3. 동행자 선택 이벤트
      els.companionBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          els.companionBtns.forEach(b => {
            b.className = 'companion-btn flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl border border-slate-200 bg-white text-slate-600 text-xs font-semibold transition active:scale-95';
          });
          btn.className = 'companion-btn selected flex flex-col items-center justify-center gap-1 py-3 px-2 rounded-2xl border-2 border-blue-600 bg-blue-50/60 text-blue-700 text-xs font-bold transition active:scale-95';
          
          state.companion = btn.dataset.value;
        });
      });

      // 4. 관심사 다중 선택 이벤트
      els.interestBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.value;
          const idx = state.interests.indexOf(val);
          
          if (idx > -1) {
            state.interests.splice(idx, 1);
            btn.className = 'interest-btn px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200/70 transition active:scale-95';
          } else {
            state.interests.push(val);
            btn.className = 'interest-btn selected px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition active:scale-95';
          }
        });
      });

      // 5. 일정 생성 버튼 클릭
      els.generateBtn.addEventListener('click', handleGeneratePlan);

      // 6. 복사 및 상단 이동 버튼
      els.copyItineraryBtn.addEventListener('click', copyItineraryToClipboard);
      els.copyBottomBtn.addEventListener('click', copyItineraryToClipboard);
      els.scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // 첫 화면 진입 시 바로 레이아웃을 확인할 수 있도록 기본 예시 일정 렌더링
      const initialMock = generateSmartMockItinerary(state);
      state.currentPlan = initialMock;
      state.isMockData = true;
      renderItinerary(initialMock, true);
    }

    // 인기 여행지 칩 하이라이트 동기화
    function updateDestChipHighlight() {
      els.destChips.forEach(chip => {
        if (chip.dataset.dest === state.destination) {
          chip.className = 'dest-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-200 transition active:scale-95';
        } else {
          chip.className = 'dest-chip shrink-0 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600 border border-transparent hover:bg-slate-200/70 transition active:scale-95';
        }
      });
    }

    // 일정 생성 메인 핸들러 (/api/plan 호출 후 실패 시 예시 데이터 폴백)
    async function handleGeneratePlan() {
      const destination = els.destInput.value.trim();
      if (!destination) {
        els.formErrorMsg.textContent = '여행지를 입력해 주세요!';
        els.formErrorMsg.classList.remove('hidden');
        els.destInput.focus();
        return;
      }
      state.destination = destination;
      els.formErrorMsg.classList.add('hidden');

      // UI 로딩 상태로 전환
      setLoadingState(true);

      const payload = {
        destination: state.destination,
        duration: state.durationLabel,
        daysCount: state.daysCount,
        companion: state.companion,
        interests: state.interests.length > 0 ? state.interests : ['핵심 명소', '로컬 맛집']
      };

      try {
        // Vercel Serverless Function (/api/plan) 호출 시도
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 25000); // 25초 타임아웃

        const response = await fetch('/api/plan', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload),
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        const data = await response.json().catch(() => ({}));

        // 여행과 무관한 요청 거절 등 400 오류는 서버의 error 메시지를 그대로 화면에 표시
        if (response.status === 400 && data.error) {
          els.generateBtn.disabled = false;
          els.loadingSection.classList.add('hidden');
          els.formErrorMsg.textContent = data.error;
          els.formErrorMsg.classList.remove('hidden');
          return;
        }

        if (!response.ok) {
          throw new Error(data.error || `HTTP Error: ${response.status}`);
        }

        // 응답 데이터 유효성 검증
        if (!data || !Array.isArray(data.days) || data.days.length === 0) {
          throw new Error('올바르지 않은 일정 데이터 형식입니다.');
        }

        // 실제 API 성공 시 렌더링
        state.currentPlan = data;
        state.isMockData = false;
        setLoadingState(false);
        renderItinerary(data, false);

      } catch (error) {
        // /api/plan이 아직 없거나 네트워크 오류 발생 시 자연스러운 예시 데이터로 폴백
        console.info('[트립메이트 AI] /api/plan 응답 대기 중 — 예시 일정을 표시합니다:', error.message);
        
        // 사용자에게 생성 중임을 체감시켜 주는 짧은 딜레이
        await new Promise(resolve => setTimeout(resolve, 900));

        const mockData = generateSmartMockItinerary(payload);
        state.currentPlan = mockData;
        state.isMockData = true;
        setLoadingState(false);
        renderItinerary(mockData, true);
      }

      // 결과 영역으로 부드럽게 스크롤
      setTimeout(() => {
        els.resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    // 로딩 UI 제어
    function setLoadingState(isLoading) {
      els.generateBtn.disabled = isLoading;
      if (isLoading) {
        els.loadingTitle.textContent = `${state.destination} ${state.durationLabel} 맞춤 동선을 짜고 있어요...`;
        els.loadingSection.classList.remove('hidden');
        els.resultSection.classList.add('hidden');
      } else {
        els.loadingSection.classList.add('hidden');
        els.resultSection.classList.remove('hidden');
      }
    }

    // 하루별 일정 카드 렌더링 함수
    function renderItinerary(plan, isMock) {
      state.selectedDayFilter = 'ALL';

      // 헤더 배지 업데이트
      if (isMock) {
        els.fallbackNotice.classList.remove('hidden');
        els.apiStatusBadge.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200/70';
        els.apiStatusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>예시 모드';
      } else {
        els.fallbackNotice.classList.add('hidden');
        els.apiStatusBadge.className = 'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/70';
        els.apiStatusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Gemini 연동됨';
      }

      // 요약 카드 텍스트 업데이트
      els.resultTitle.textContent = `${plan.destination} 맞춤 여행 일정`;
      els.resultDurationBadge.textContent = plan.duration || state.durationLabel;
      els.resultCompanionBadge.textContent = `${getCompanionEmoji(plan.companion)} ${plan.companion}`;
      els.resultSummary.textContent = plan.summary || `${plan.destination}의 매력을 알차게 즐길 수 있는 하루별 추천 동선입니다.`;

      // 관심사 태그 렌더링
      const interests = plan.interests && plan.interests.length > 0 ? plan.interests : state.interests;
      els.resultInterestsList.innerHTML = interests.map(tag => `
        <span class="px-2.5 py-1 rounded-lg text-[11px] font-medium bg-white/10 text-blue-100">#${escapeHtml(tag)}</span>
      `).join('');

      // Day 필터 탭 생성
      renderDayFilterTabs(plan.days);

      // Day 카드 목록 생성
      renderDayCards(plan.days, plan.destination);
    }

    // Day 필터 탭 렌더링
    function renderDayFilterTabs(days) {
      let tabsHtml = `
        <button type="button" data-day="ALL" class="day-tab shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition">
          전체 일정 (${days.length}일)
        </button>
      `;

      days.forEach(d => {
        tabsHtml += `
          <button type="button" data-day="${d.day}" class="day-tab shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition">
            Day ${d.day}
          </button>
        `;
      });

      els.dayFilterTabs.innerHTML = tabsHtml;

      // 탭 클릭 이벤트 바인딩
      const tabBtns = els.dayFilterTabs.querySelectorAll('.day-tab');
      tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const targetDay = btn.dataset.day;
          state.selectedDayFilter = targetDay;

          tabBtns.forEach(b => {
            b.className = 'day-tab shrink-0 px-3.5 py-2 rounded-xl text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition';
          });
          btn.className = 'day-tab shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm transition';

          const filteredDays = targetDay === 'ALL'
            ? state.currentPlan.days
            : state.currentPlan.days.filter(d => String(d.day) === targetDay);

          renderDayCards(filteredDays, state.currentPlan.destination);
        });
      });
    }

    // 하루별 일정 카드 HTML 생성
    function renderDayCards(days, destination) {
      els.daysContainer.innerHTML = days.map((dayObj, index) => {
        const itemsHtml = dayObj.items.map((item, idx) => {
          const isLast = idx === dayObj.items.length - 1;
          const badgeStyle = getCategoryStyle(item.category);
          const mapSearchUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(destination + ' ' + item.place)}`;

          return `
            <div class="relative pl-7 ${isLast ? '' : 'pb-6'}">
              <!-- 세로 타임라인 연결선 -->
              ${!isLast ? '<span class="absolute left-[9px] top-6 bottom-0 w-[2px] bg-slate-100"></span>' : ''}
              
              <!-- 타임라인 포인트 도트 -->
              <span class="absolute left-0 top-1.5 w-5 h-5 rounded-full ${badgeStyle.dotBg} flex items-center justify-center ring-4 ring-white">
                <span class="w-2 h-2 rounded-full ${badgeStyle.dotColor}"></span>
              </span>

              <!-- 개별 장소 카드 -->
              <div class="bg-slate-50/80 hover:bg-slate-50 rounded-2xl p-3.5 border border-slate-100/90 transition">
                <div class="flex items-center justify-between gap-2 mb-1.5">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-slate-500 font-mono">${escapeHtml(item.time)}</span>
                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${badgeStyle.badgeClass}">
                      ${escapeHtml(item.category)}
                    </span>
                  </div>
                  <!-- 지도 열기 링크 -->
                  <a 
                    href="${mapSearchUrl}" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    class="inline-flex items-center gap-0.5 text-[11px] font-semibold text-blue-600 hover:text-blue-700"
                  >
                    <span>지도</span>
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                  </a>
                </div>

                <h4 class="text-[15px] font-bold text-slate-900 leading-snug">${escapeHtml(item.place)}</h4>
                <p class="text-xs text-slate-600 mt-1 leading-relaxed">${escapeHtml(item.description)}</p>

                ${item.tip ? `
                  <div class="mt-2.5 pt-2 border-t border-slate-200/60 flex items-start gap-1.5">
                    <span class="text-[11px] shrink-0">💡</span>
                    <p class="text-[11px] text-slate-500 leading-snug">${escapeHtml(item.tip)}</p>
                  </div>
                ` : ''}
              </div>
            </div>
          `;
        }).join('');

        return `
          <article style="animation-delay: ${index * 80}ms" class="animate-fade-up bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
            <!-- Day 카드 헤더 -->
            <div class="flex items-center justify-between gap-2 pb-4 mb-4 border-b border-slate-100">
              <div class="flex items-center gap-2.5">
                <span class="px-3 py-1 rounded-xl bg-blue-600 text-white text-xs font-extrabold tracking-wide shadow-sm shadow-blue-500/20">
                  DAY ${dayObj.day}
                </span>
                <h3 class="text-sm font-bold text-slate-900 leading-snug">${escapeHtml(dayObj.title)}</h3>
              </div>
              <span class="text-[11px] font-semibold text-slate-400 shrink-0">${dayObj.items.length}곳</span>
            </div>

            <!-- 타임라인 리스트 -->
            <div>
              ${itemsHtml}
            </div>
          </article>
        `;
      }).join('');
    }

    // 카테고리별 색상/스타일 매핑
    function getCategoryStyle(category) {
      const cat = (category || '').trim();
      if (cat.includes('맛집') || cat.includes('식사')) {
        return {
          badgeClass: 'bg-orange-100 text-orange-700',
          dotBg: 'bg-orange-100',
          dotColor: 'bg-orange-500'
        };
      }
      if (cat.includes('카페') || cat.includes('디저트')) {
        return {
          badgeClass: 'bg-amber-100 text-amber-800',
          dotBg: 'bg-amber-100',
          dotColor: 'bg-amber-500'
        };
      }
      if (cat.includes('쇼핑') || cat.includes('소품')) {
        return {
          badgeClass: 'bg-purple-100 text-purple-700',
          dotBg: 'bg-purple-100',
          dotColor: 'bg-purple-500'
        };
      }
      if (cat.includes('휴식') || cat.includes('숙소') || cat.includes('야경')) {
        return {
          badgeClass: 'bg-indigo-100 text-indigo-700',
          dotBg: 'bg-indigo-100',
          dotColor: 'bg-indigo-500'
        };
      }
      // 기본값: 관광/명소/액티비티
      return {
        badgeClass: 'bg-sky-100 text-sky-700',
        dotBg: 'bg-sky-100',
        dotColor: 'bg-sky-500'
      };
    }

    // 동행자 이모지 반환
    function getCompanionEmoji(companion) {
      const map = {
        '혼자서': '🎒',
        '연인과': '💑',
        '친구와': '👯',
        '아이와 가족': '👨‍👩‍👧‍👦',
        '부모님과': '🌿',
        '반려동물과': '🐶'
      };
      return map[companion] || '✈️';
    }

    // ============================================================================
    // 스마트 예시 일정 생성기 (/api/plan 미연결 시 작동)
    // 사용자가 입력한 여행지, 기간, 동행자, 관심사를 반영해 자연스러운 카드를 생성합니다.
    // ============================================================================
    function generateSmartMockItinerary({ destination, duration, daysCount, companion, interests }) {
      const dest = destination || '제주도';
      const count = daysCount || 3;
      const interestList = interests && interests.length > 0 ? interests : ['맛집 탐방', '감성 카페'];
      const primaryInterest = interestList[0];

      // 인기 여행지 전용 큐레이션 데이터 (제주도, 도쿄, 부산)
      const presets = {
        '제주도': [
          {
            day: 1,
            title: '에메랄드빛 애월 해안과 노을 산책',
            items: [
              { time: '10:30', category: '관광', place: '애월 한담해안산책로', description: '투명한 제주 바다 바로 옆 곽지해수욕장까지 이어지는 해안 산책길입니다.', tip: '오전 시간대에는 윤슬이 반짝여 사진이 가장 예쁘게 나옵니다.' },
              { time: '12:30', category: '맛집', place: '애월 로컬 흑돼지 & 몸국 식당', description: '제주 대표 향토 음식과 숯불 향 가득한 흑돼지 정식으로 든든하게 점심을 즐겨보세요.', tip: '웨이팅이 있을 수 있으니 테이블링 앱으로 미리 원격 줄서기를 추천해요.' },
              { time: '14:30', category: '카페', place: '애월 오션뷰 통창 베이커리 카페', description: '탁 트인 바다를 바라보며 우도 땅콩 라떼와 수제 디저트로 여유를 만끽합니다.', tip: '2층 야외 테라스 자리가 최고의 포토존입니다.' },
              { time: '17:30', category: '관광', place: '신창풍차해안도로 일몰 감상', description: '하얀 풍차와 붉게 물드는 수평선이 어우러지는 제주 서쪽 최고의 드라이브 코스입니다.', tip: '일몰 30분 전에 도착해 산책 데크를 걸어보세요.' }

              { time: '12:40', category: '맛집', place: '성산 갈치조림 & 전복뚝배기 전문점', description: '신선한 은갈치와 푸짐한 해산물이 들어간 칼칼한 제주식 점심 한 상입니다.', tip: '공깃밥에 갈치조림 양념을 비벼 먹으면 더욱 맛있습니다.' },
              { time: '15:00', category: '쇼핑', place: '종달리 & 세화 감성 소품샵 투어', description: '아기자기한 제주 기념품과 엽서, 캔들을 구경하며 골목 산책을 즐겨보세요.', tip: '골목 주차가 협소하니 공영주차장을 이용하세요.' },
              { time: '18:00', category: '카페', place: '함덕 서우봉 해변 야경 & 펍', description: '밤바다의 파도 소리를 들으며 가볍게 수제 맥주나 논알코올 칵테일로 하루를 마무리합니다.', tip: '밤에는 바닷바람이 선선하니 얇은 겉옷을 챙기세요.' }
            ]
          },
          {
            day: 3,
            title: '동문시장 로컬 미식과 공항 근처 마무리',
            items: [
              { time: '10:30', category: '카페', place: '제주시 용담 해안도로 브런치 카페', description: '비행기 이착륙 풍경과 푸른 바다가 보이는 곳에서 여유로운 브런치를 즐깁니다.', tip: '창가 좌석은 오전 오픈 직후 방문 시 선점하기 좋습니다.' },
              { time: '12:30', category: '맛집', place: '제주 동문재래시장 먹거리 투어', description: '딱새우회, 오메기떡, 흑돼지 강정 등 제주 대표 간식과 기념품을 한곳에서 만나보세요.', tip: '현금이나 지역화폐(탐나는전)를 준비하면 결제가 편리합니다.' },
              { time: '15:00', category: '관광', place: '도두봉 무지개해안도로 & 키세스존', description: '공항에서 차로 10분 거리! 마지막 인증샷을 남기고 렌터카 반납 후 공항으로 이동합니다.', tip: '출발 1시간 30분 전까지는 렌터카 셔틀 탑승을 권장합니다.' }
            ]
          }
        ],
        '도쿄': [
          {
            day: 1,
            title: '시부야 스카이와 트렌디한 도심 산책',
            items: [
              { time: '11:00', category: '맛집', place: '시부야 정통 돈카츠 & 라멘 전문점', description: '도착 후 첫 식사로 진한 육수의 라멘이나 두툼한 로스카츠로 에너지를 충전합니다.', tip: '점심 피크타임(12시) 직전에 방문하면 대기 시간을 줄일 수 있어요.' },
              { time: '13:30', category: '쇼핑', place: '하라주쿠 캣스트리트 & 오모테산도', description: '감각적인 편집숍과 플래그십 스토어가 줄지어 있는 도쿄 패션의 중심지입니다.', tip: '골목 안쪽 숨은 빈티지 숍도 꼭 들러보세요.' },
              { time: '16:30', category: '관광', place: '시부야 스카이 전망대 (일몰 시간)', description: '360도 파노라마 뷰로 도쿄 타워와 후지산 방향의 황홀한 매직아워를 감상합니다.', tip: '일몰 시간대 티켓은 2~4주 전 사전 예약이 필수입니다.' },
              { time: '19:30', category: '맛집', place: '에비스 요코초 로컬 이자카야 거리', description: '현지 직장인들과 어우러져 야키토리와 시원한 생맥주를 즐기는 활기찬 밤입니다.', tip: '자릿세(오토시) 문화가 있으니 참고해 주세요.' }
            ]
          },
          {
            day: 2,
            title: '아사쿠사의 전통미와 긴자 미식 탐방',
            items: [
              { time: '09:30', category: '관광', place: '아사쿠사 센소지 & 나카미세 도리', description: '거대한 붉은 등불 카미나리몬을 지나 전통 상점가에서 갓 구운 메론빵과 당고를 맛봅니다.', tip: '오전 10시 이전에 도착해야 인파를 피해 쾌적하게 둘러볼 수 있어요.' },
              { time: '12:30', category: '맛집', place: '츠키지 장외시장 스시 & 해산물 덮밥', description: '신선한 참치와 성게알이 올라간 카이센동으로 입안 가득 바다의 풍미를 느껴보세요.', tip: '일부 점포는 현금만 받으니 엔화 지폐를 넉넉히 준비하세요.' },
              { time: '15:00', category: '카페', place: '긴자 킷사텐 핸드드립 커피 & 파르페', description: '클래식한 일본식 다방 분위기 속에서 장인이 내린 융드립 커피와 계절 파르페를 즐깁니다.', tip: '긴자 메인 거리는 주말 오후 보행자 천국으로 운영됩니다.' },
              { time: '18:30', category: '휴식', place: '도쿄역 마루노우치 야경 산책', description: '붉은 벽돌의 도쿄역 역사와 세련된 빌딩 숲 야경을 배경으로 산책하며 하루를 정리합니다.', tip: 'KITTE 빌딩 6층 옥상정원에서 무료로 도쿄역 야경을 내려다볼 수 있어요.' }
            ]
          }
        ]
      };

      // 프리셋이 존재하고 일수가 맞으면 프리셋 활용, 그 외에는 맞춤형 동적 생성
      if (presets[dest] && count <= presets[dest].length) {
        return {
          destination: dest,
          duration: duration,
          companion: companion,
          interests: interestList,
          summary: `${companion} 함께 떠나는 ${dest} ${duration} 추천 코스입니다. '${interestList.join(', ')}' 테마를 중심으로 이동 동선을 최적화했어요.`,
          days: presets[dest].slice(0, count)
        };
      }

      // 어떤 도시/여행지를 입력하더라도 지정한 일수(1~5일)만큼 풍부한 일정 카드 자동 생성
      const dayThemes = [
        `${dest} 핵심 랜드마크와 설레는 첫 만남`,
        `현지인 추천 로컬 미식과 ${primaryInterest} 데이`,
        `여유로운 골목 산책과 숨은 명소 탐방`,
        `${dest} 근교 자연 힐링과 야경 스팟`,
        `아쉬움을 달래는 브런치와 기념품 쇼핑`
      ];

      const generatedDays = [];
      for (let d = 1; d <= count; d++) {
        const isFirstDay = d === 1;
        const isLastDay = d === count && count > 1;

        const items = [
          {
            time: isFirstDay ? '10:30' : '10:00',
            category: '관광',
            place: isFirstDay ? `${dest} 대표 시그니처 명소` : `${dest} ${d}일차 핵심 산책 코스`,
            description: `${companion} 함께 ${dest}의 매력을 가장 잘 느낄 수 있는 대표 스팟에서 여유롭게 둘러봅니다.`,
            tip: '오전 시간대에 방문하면 인파가 적어 사진 촬영하기 훨씬 수월합니다.'
          },
          {
            time: '12:30',
            category: '맛집',
            place: `${dest} 현지인 추천 로컬 맛집`,
            description: `여행에서 빼놓을 수 없는 미식 시간! ${dest} 지역 특색이 담긴 대표 메뉴로 든든하게 식사합니다.`,
            tip: '점심 피크 시간(12:00~13:00)을 살짝 피해 방문하면 대기 시간을 아낄 수 있어요.'
          },
          {
            time: '15:00',
            category: interestList.includes('쇼핑/소품샵') ? '쇼핑' : '카페',
            place: interestList.includes('쇼핑/소품샵') ? `${dest} 감성 편집숍 & 소품 거리` : `${dest} 뷰 맛집 시그니처 카페`,
            description: `'${primaryInterest}' 취향을 반영한 공간에서 시그니처 음료와 함께 잠시 쉬어가는 힐링 타임입니다.`,
            tip: '창가 자리나 포토존에서 여행의 추억을 사진으로 남겨보세요.'
          }
        ];

        if (!isLastDay) {
          items.push({
            time: '18:30',
            category: '휴식',
            place: `${dest} 선셋 전망 포인트 & 저녁 산책`,
            description: `해 질 녘 노을과 반짝이는 야경을 감상하며 ${companion} 도란도란 이야기를 나누는 시간입니다.`,
            tip: '저녁에는 일교차가 있을 수 있으니 가벼운 겉옷을 챙기시면 좋습니다.'
          });
        } else {
          items.push({
            time: '16:30',
            category: '쇼핑',
            place: `${dest} 기념품 숍 & 귀가 준비`,
            description: `여행의 여운을 간직할 로컬 특산품과 기념품을 고른 뒤 안전하게 출발지로 이동합니다.`,
            tip: '출발 시간 1시간 전까지는 터미널/역/공항에 도착하도록 여유를 두세요.'
          });
        }

        generatedDays.push({
          day: d,
          title: dayThemes[(d - 1) % dayThemes.length],
          items
        });
      }

      return {
        destination: dest,
        duration: duration,
        companion: companion,
        interests: interestList,
        summary: `${companion} 함께하는 ${dest} ${duration} 맞춤 일정입니다. 선택하신 '${interestList.join(', ')}' 취향을 반영해 동선을 구성했습니다.`,
        days: generatedDays
      };
    }

    // 일정 전체 텍스트 클립보드 복사 (iFrame 환경 호환을 위해 execCommand 사용)
    function copyItineraryToClipboard() {
      if (!state.currentPlan) return;

      const plan = state.currentPlan;
      let text = `✈️ [${plan.destination} ${plan.duration} 여행 일정]\n`;
      text += `• 동행: ${plan.companion}\n`;
      text += `• 테마: ${(plan.interests || []).join(', ')}\n`;
      text += `• 요약: ${plan.summary}\n\n`;

      plan.days.forEach(d => {
        text += `📅 DAY ${d.day} - ${d.title}\n`;
        d.items.forEach(item => {
          text += `  [${item.time}] (${item.category}) ${item.place}\n`;
          text += `   └ ${item.description}\n`;
        });
        text += `\n`;
      });

      try {
        const textarea = document.createElement('textarea');
        textarea.value = text.trim();
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('전체 여행 일정이 클립보드에 복사되었어요!');
      } catch (err) {
        showToast('복사에 실패했습니다. 다시 시도해 주세요.');
      }
    }

    // 하단 토스트 메시지 표시
    let toastTimer = null;
    function showToast(msg) {
      els.toastMessage.textContent = msg;
      els.toast.classList.remove('opacity-0', 'translate-y-3');
      els.toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        els.toast.classList.remove('opacity-100', 'translate-y-0');
        els.toast.classList.add('opacity-0', 'translate-y-3');
      }, 2600);
    }

    // XSS 방지용 HTML 이스케이프 헬퍼
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 페이지 로드 시 초기화 실행
    window.addEventListener('DOMContentLoaded', init);
  </script>
